<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GuruGuard</title><link rel="stylesheet" href="popup.css"></head><body>
<header><a class="brand" href="https://guruguard.shepardai.pro" target="_blank" rel="noopener">GuruGuard</a><a class="directory" href="https://guruguard.shepardai.pro/#community-list" target="_blank" rel="noopener" aria-label="Browse the community list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"/></svg></a></header>
<main>
<div class="protection"><div><strong id="protection-label">Protection is off</strong><p id="permission-status" role="status">Enable once. Checks run as you browse.</p></div><label class="switch"><input type="checkbox" id="auto-reviews" aria-label="Automatic Instagram protection"><span aria-hidden="true"></span></label></div>
<button id="local-scan" class="secondary current-profile" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17 7h.01"/></svg><span id="current-profile-label">Check open profile</span></button>
<form id="search-form"><label class="sr-only" for="username">Instagram username</label><div class="search-input"><span aria-hidden="true">@</span><input id="username" placeholder="Search a username" autocomplete="off" spellcheck="false" maxlength="31" required><button type="submit" aria-label="Check username"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button></div></form>
<section id="result" aria-live="polite" tabindex="-1"><div class="empty"><p>Open a profile. We’ll check it here.</p><a href="https://guruguard.shepardai.pro/#community-list" target="_blank" rel="noopener">Browse the list</a></div></section>
<details class="settings"><summary>Settings</summary><p>Public content only. Never your messages.</p><label for="hidden-profiles">Hidden in this browser</label><div class="hidden-tools"><select id="hidden-profiles" aria-label="Hidden accounts"><option value="">No hidden accounts</option></select><button id="unhide-profile" class="secondary" type="button" disabled>Unhide</button></div><p id="hidden-status" role="status"></p></details>
<details class="settings"><summary>AI credits <span id="credit-count"></span></summary><p id="credit-balance">Connect your account to use AI credits.</p><a href="https://guruguard.shepardai.pro/#credits" target="_blank" rel="noopener">Account &amp; credits</a><form id="pair-form"><label for="pair-code">Connection code</label><input id="pair-code" autocomplete="off" maxlength="64" required placeholder="Paste your account code"><button class="secondary" type="submit">Connect</button></form><p id="pair-status" role="status"></p></details>
</main><footer><a href="https://guruguard.shepardai.pro/#community-list" target="_blank" rel="noopener">Community list</a><span>1.1.1</span></footer><script type="module" src="popup.js"></script></body></html>
